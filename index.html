<style>
:root{--bg:#fff;--ink:#111;--mute:#6f6f6f;--line:#111;--hair:#d9d9d9;--red:#d4301f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--ink:#f2f2f2;--mute:#9a9a9a;--line:#f2f2f2;--hair:#333;--red:#ff6a57}}
:root[data-theme="dark"]{--bg:#111;--ink:#f2f2f2;--mute:#9a9a9a;--line:#f2f2f2;--hair:#333;--red:#ff6a57}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 52px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
header{padding-top:44px}
h1{font-weight:300;font-size:clamp(2.4rem,11vw,4.4rem);line-height:.98;letter-spacing:-.035em;margin:0 0 28px}
.tb{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.tb div{padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.92rem}
.tb div:nth-child(2n){border-right:0}
.tb div:nth-last-child(-n+2){border-bottom:0}
.tb small{display:block;color:var(--mute);font-size:.74rem;line-height:1.3}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);margin-top:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:22px;overflow-x:auto}
nav button{flex:none;font:inherit;font-weight:400;color:var(--mute);background:none;border:0;border-bottom:3px solid transparent;padding:12px 0 9px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
main{padding:30px 0 70px}
section[hidden]{display:none}
.dh{display:flex;align-items:flex-end;gap:16px;margin-bottom:6px}
.dh .n{font-weight:300;font-size:6.5rem;line-height:.78;letter-spacing:-.06em}
.dh h2{margin:0;font-weight:600;font-size:1.05rem;line-height:1.25}
.dh h2 span{display:block;font-weight:400;color:var(--mute)}
.lead{margin:14px 0 26px;color:var(--mute);max-width:46ch}
.row{display:grid;grid-template-columns:70px 24px 1fr;gap:0 8px;border-top:1px solid var(--hair);padding:13px 0}
.row:first-of-type{border-top:1px solid var(--line)}
.t{font-weight:600;font-size:.9rem;line-height:1.3;font-variant-numeric:tabular-nums}
.t small{display:block;font-weight:400;color:var(--mute);font-size:.8rem}
.k{color:var(--mute);font-size:.8rem;padding-top:2px;font-variant-numeric:tabular-nums}
h3{margin:0;font-weight:600;font-size:1.05rem;line-height:1.3}
.p{margin:1px 0 0}
.a{margin:0;color:var(--mute);font-size:.86rem}
.n2{margin:8px 0 0;padding-left:10px;border-left:2px solid var(--ink);font-size:.88rem}
.n2.w{border-left-color:var(--red)}
.m{display:inline-block;margin-top:7px;font-size:.85rem;color:var(--ink);text-underline-offset:3px}
.go{display:grid;grid-template-columns:70px 24px 1fr;gap:0 8px;padding:5px 0;color:var(--mute);font-size:.83rem}
.go span{grid-column:3;border-left:1px dashed var(--mute);padding-left:10px}
.end h3{color:var(--mute);font-weight:400}
.cf{display:grid;grid-template-columns:78px 1fr;border-top:1px solid var(--hair);padding:10px 0}
.cf:first-of-type{border-top:1px solid var(--line)}
.cf b{font-weight:600;font-variant-numeric:tabular-nums}
.cf.s span::after{content:" (itinerary stop)";color:var(--red);font-size:.82rem}
.cf.s2 span::after{content:" (studio pick)";color:var(--red);font-size:.82rem}
table{width:100%;border-collapse:collapse;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
th,td{text-align:left;padding:11px 0;border-bottom:1px solid var(--hair);font-weight:400}
th{font-weight:600}
th:nth-child(n+2),td:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-bottom:0}
.est{font-weight:300;font-size:4rem;line-height:1;letter-spacing:-.04em;margin:8px 0 2px}
@media (max-width:440px){.row,.go{grid-template-columns:58px 20px 1fr}.dh .n{font-size:5rem}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
